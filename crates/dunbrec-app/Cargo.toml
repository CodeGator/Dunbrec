[package]
name = "dunbrec-app"
description = "Dunbrec desktop application: schematic editor and simulator front end"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "dunbrec"
path = "src/main.rs"

[dependencies]
dunbrec-core.workspace = true
dunbrec-io.workspace = true
dunbrec-sim.workspace = true
dunbrec-mcu.workspace = true
dunbrec-instruments.workspace = true
eframe = { version = "0.33", features = ["persistence"] }
egui = "0.33"
egui_dock = { version = "0.18", features = ["serde"] }
rfd = "0.17"
serde.workspace = true
serde_json = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3"
keyring = { version = "3", features = ["windows-native"] }
trash = "5.4.0"

[build-dependencies]
serde_json = "1"
flate2 = "1"

[dev-dependencies]
ron.workspace = true
