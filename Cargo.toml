[workspace]
resolver = "3"
members = [
    "crates/dunbrec-core",
    "crates/dunbrec-io",
    "crates/dunbrec-sim",
    "crates/dunbrec-instruments",
    "crates/dunbrec-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
dunbrec-core = { path = "crates/dunbrec-core" }
dunbrec-io = { path = "crates/dunbrec-io" }
dunbrec-sim = { path = "crates/dunbrec-sim" }
dunbrec-instruments = { path = "crates/dunbrec-instruments" }
serde = { version = "1", features = ["derive"] }
ron = "0.10"
thiserror = "2"
approx = "0.5"
num-complex = "0.4"
